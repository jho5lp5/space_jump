{% load static %}
<div class="modal-dialog modal-dialog-centered modal-xl" role="document">
    <div class="modal-content border-0 shadow roboto-condensed-regular">
        <div id="modal-loader" class="overlay" style="display: none">
            <i class="fas fa-3x fa-sync fa-spin text-primary"></i>
        </div>
        
        <div class="modal-header bg-primary text-white border-0">
            <h5 class="modal-title font-weight-bold">
                <i class="fas fa-user-plus mr-2"></i>Registro de Nuevo Deportista
            </h5>
            <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                <span aria-hidden="true">&times;</span>
            </button>
        </div>

        <form id="form-student" action="{% url 'apps.students:save_student' %}" method="POST" enctype="multipart/form-data">
            {% csrf_token %}

            <div class="modal-body p-4">
                <!-- Datos Personales del Deportista -->
                <div class="row mb-4">
                    <div class="col-12">
                        <div class="card card-outline card-primary">
                            <div class="card-header">
                                <h6 class="card-title text-primary mb-0">
                                    <i class="fas fa-user mr-2"></i>Datos Personales del Deportista
                                </h6>
                            </div>
                            <div class="card-body">
                                <div class="row">
                                    <div class="col-lg-9">
                                        <div class="row">
                                            <div class="col-lg-3">
                                                <div class="form-group mb-2">
                                                    <label class="form-label" for="document">
                                                        <i class="fas fa-tag mr-1"></i>Tipo Doc. <span class="text-danger">*</span>
                                                    </label>
                                                    <select class="form-control" id="document" name="document" required>
                                                        <option value="01">DNI</option>
                                                        <option value="06">RUC</option>
                                                    </select>
                                                </div>
                                            </div>
                                            <div class="col-lg-3">
                                                <div class="form-group mb-2">
                                                    <label class="form-label" for="document_number">
                                                        <i class="fas fa-hashtag mr-1"></i>Número <span class="text-danger">*</span>
                                                    </label>
                                                    <input type="text" class="form-control" id="document_number"
                                                           name="document_number" required placeholder="Número de documento">
                                                </div>
                                            </div>
                                            <div class="col-lg-3">
                                                <div class="form-group mb-2">
                                                    <label class="form-label" for="birth_date">
                                                        <i class="fas fa-calendar mr-1"></i>Fecha Nacimiento
                                                    </label>
                                                    <input type="date" class="form-control" id="birth_date" name="birth_date">
                                                </div>
                                            </div>
                                            <div class="col-lg-3">
                                                <div class="form-group mb-2">
                                                    <label class="form-label" for="subsidiary">
                                                        <i class="fas fa-building mr-1"></i>Sede
                                                    </label>
                                                    <select class="form-control" id="subsidiary" name="subsidiary">
                                                        <option value="">Seleccione...</option>
                                                        {% for subsidiary in subsidiaries %}
                                                            <option value="{{ subsidiary.id }}">{{ subsidiary.name }}</option>
                                                        {% endfor %}
                                                    </select>
                                                </div>
                                            </div>
                                        </div>
                                        <div class="row">
                                            <div class="col-lg-6">
                                                <div class="form-group mb-2">
                                                    <label class="form-label" for="first_name">
                                                        <i class="fas fa-user mr-1"></i>Nombres <span class="text-danger">*</span>
                                                    </label>
                                                    <input type="text" class="form-control" id="first_name"
                                                           name="first_name" required placeholder="Nombres completos">
                                                </div>
                                            </div>
                                            <div class="col-lg-6">
                                                <div class="form-group mb-2">
                                                    <label class="form-label" for="surname">
                                                        <i class="fas fa-user mr-1"></i>Apellidos <span class="text-danger">*</span>
                                                    </label>
                                                    <input type="text" class="form-control" id="surname"
                                                           name="surname" required placeholder="Apellidos completos">
                                                </div>
                                            </div>
                                        </div>
                                        <div class="row">
                                            <div class="col-lg-8">
                                                <div class="form-group mb-2">
                                                    <label class="form-label" for="address">
                                                        <i class="fas fa-map-marker-alt mr-1"></i>Domicilio
                                                    </label>
                                                    <input type="text" class="form-control" id="address"
                                                           name="address" placeholder="Dirección completa">
                                                </div>
                                            </div>
                                            <div class="col-lg-4">
                                                <div class="form-group mb-2">
                                                    <label class="form-label" for="phone">
                                                        <i class="fas fa-phone mr-1"></i>Teléfono
                                                    </label>
                                                    <input type="tel" class="form-control" id="phone"
                                                           name="phone" placeholder="987654321">
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                    <div class="col-lg-3 d-flex justify-content-center align-self-center">
                                        <div class="avatar-preview-container">
                                            <img id="avatar-preview" src="{% static 'dist/img/employee0.jpg' %}"
                                                 alt="Avatar" class="avatar-preview-img">
                                        </div>
                                    </div>
                                </div>
                                <div class="row mt-2">
                                    <div class="col-md-12">
                                        <div class="form-group mb-0">
                                            <label class="form-label" for="photo">
                                                <i class="fas fa-image mr-1"></i>Foto del Deportista
                                            </label>
                                            <div class="custom-file">
                                                <input type="file" class="custom-file-input" id="photo" name="photo" accept="image/*">
                                                <label class="custom-file-label" for="photo">Subir Imagen</label>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Datos del Padre/Madre/Apoderado -->
                <div class="row mb-4">
                    <div class="col-12">
                        <div class="card card-outline card-info">
                            <div class="card-header">
                                <h6 class="card-title text-info mb-0">
                                    <i class="fas fa-users mr-2"></i>Datos del Padre/Madre/Apoderado
                                </h6>
                            </div>
                            <div class="card-body">
                                <div class="row">
                                    <div class="col-md-3">
                                        <div class="form-group mb-0">
                                            <label class="form-label">Nombres</label>
                                            <input type="text" class="form-control" name="parent_first_name">
                                        </div>
                                    </div>
                                    <div class="col-md-3">
                                        <div class="form-group mb-0">
                                            <label class="form-label">Apellidos</label>
                                            <input type="text" class="form-control" name="parent_surname">
                                        </div>
                                    </div>
                                    <div class="col-md-2">
                                        <div class="form-group mb-0">
                                            <label class="form-label">Tipo Doc.</label>
                                            <select class="form-control" name="parent_document">
                                                <option value="01">DNI</option>
                                                <option value="06">RUC</option>
                                            </select>
                                        </div>
                                    </div>
                                    <div class="col-md-2">
                                        <div class="form-group mb-0">
                                            <label class="form-label">Número</label>
                                            <input type="text" class="form-control" name="parent_document_number">
                                        </div>
                                    </div>
                                    <div class="col-md-2">
                                        <div class="form-group mb-0">
                                            <label class="form-label">Teléfono</label>
                                            <input type="tel" class="form-control" name="parent_phone">
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Historia Clínica -->
                <div class="row mb-4">
                    <div class="col-12">
                        <div class="card card-outline card-warning">
                            <div class="card-header">
                                <h6 class="card-title text-warning mb-0">
                                    <i class="fas fa-heartbeat mr-2"></i>Historia Clínica
                                </h6>
                            </div>
                            <div class="card-body">
                                <div class="row">
                                    <div class="col-md-4">
                                        <div class="form-group mb-2">
                                            <label class="form-label">Enfermedades</label>
                                            <textarea class="form-control" name="diseases" rows="2"></textarea>
                                        </div>
                                    </div>
                                    <div class="col-md-4">
                                        <div class="form-group mb-2">
                                            <label class="form-label">Alergia a Medicamentos</label>
                                            <textarea class="form-control" name="medication_allergies" rows="2"></textarea>
                                        </div>
                                    </div>
                                    <div class="col-md-4">
                                        <div class="form-group mb-2">
                                            <label class="form-label">Seguro</label>
                                            <input type="text" class="form-control" name="student_insurance">
                                        </div>
                                    </div>
                                </div>
                                <div class="row">
                                    <div class="col-md-6">
                                        <div class="form-group mb-0">
                                            <label class="form-label">Lesiones Deportivas</label>
                                            <textarea class="form-control" name="sports_injuries" rows="2"></textarea>
                                        </div>
                                    </div>
                                    <div class="col-md-6">
                                        <div class="form-group mb-0">
                                            <label class="form-label">Observaciones</label>
                                            <textarea class="form-control" name="observations" rows="2"></textarea>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="modal-footer bg-light border-0 p-3">
                <button type="button" class="btn btn-secondary" data-dismiss="modal">
                    <i class="fas fa-times mr-2"></i>Cancelar
                </button>
                <button id="btn-save-student" type="submit" class="btn btn-primary">
                    <i class="fas fa-save mr-2"></i>Registrar Deportista
                </button>
            </div>
        </form>
    </div>
</div>

<style>
    .avatar-preview-container {
        width: 150px;
        height: 150px;
        border: 2px solid #dee2e6;
        border-radius: 8px;
        overflow: hidden;
    }
    .avatar-preview-img {
        width: 100%;
        height: 100%;
        object-fit: cover;
    }
    .card { border-radius: 8px; border: none; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    .card-outline.card-primary { border-top: 3px solid #007bff; }
    .card-outline.card-info { border-top: 3px solid #17a2b8; }
    .card-outline.card-warning { border-top: 3px solid #ffc107; }
    .overlay {
        position: absolute; top: 0; left: 0; width: 100%; height: 100%;
        background: rgba(255, 255, 255, 0.9); display: flex;
        align-items: center; justify-content: center; z-index: 1000;
    }
    .custom-file-label::after { content: "Buscar"; }
</style>

<script type="text/javascript">
$(document).ready(function() {
    $('#document_number').keypress(async function(e) {
        if (e.keyCode === 13) {
            e.preventDefault();
            await searchStudentAPI();
        }
    });

    window.searchStudentAPI = async function() {
        let _document_number = $('#document_number').val();
        let _type_doc = $('#document').val();
        if (!_document_number) {
            toastr.warning('Ingrese un número de documento');
            return;
        }
        try {
            const value = await studentSearch(_type_doc, _document_number);
            if (value) {
                let nombres = (value.firstName || '') + (value.secondName ? ' ' + value.secondName : '');
                let apellidos = (value.surname || '') + (value.secondSurname ? ' ' + value.secondSurname : '');
                $('#first_name').val(nombres.trim());
                $('#surname').val(apellidos.trim());
                $('#address').val(value.address || '');
                toastr.success('Datos cargados');
            }
        } catch (e) {
            toastr.error(e.responseJSON?.error || 'Error al consultar');
        }
    };

    function studentSearch($type_document, $document_number) {
        $('#modal-loader').show();
        return new Promise((resolve, reject) => {
            $.ajax({
                url: '{% url "apps.students:get_api_student" %}',
                dataType: 'json',
                type: 'GET',
                data: { 'nro_document': $document_number, 'type': $type_document },
                success: function(response, textStatus, xhr) {
                    if (xhr.status === 200) resolve(response);
                    $('#modal-loader').hide();
                },
                error: function(error) {
                    reject(error);
                    $('#modal-loader').hide();
                },
            });
        });
    }

    $('#form-student').submit(function(event) {
        event.preventDefault();
        let data = new FormData($(this).get(0));
        $('#btn-save-student').attr("disabled", "true");
        $('#modal-loader').show();

        $.ajax({
            url: $(this).attr('action'),
            type: 'POST',
            data: data,
            cache: false,
            processData: false,
            contentType: false,
            success: function(response) {
                if (response.success) {
                    toastr.success(response.message);
                    $('#modal_student_create').modal('hide');
                    setTimeout(() => location.reload(), 800);
                } else {
                    toastr.error(response.message);
                    $('#btn-save-student').removeAttr("disabled");
                }
                $('#modal-loader').hide();
            },
            error: function() {
                toastr.error('Error al registrar');
                $('#modal-loader').hide();
                $('#btn-save-student').removeAttr("disabled");
            }
        });
    });

    $('#photo').on('change', function() {
        var file = this.files[0];
        $(this).next('.custom-file-label').html($(this).val().split('\\').pop() || 'Subir Imagen');
        if (file) {
            var reader = new FileReader();
            reader.onload = function(e) { $('#avatar-preview').attr('src', e.target.result); };
            reader.readAsDataURL(file);
        }
    });
});
</script>
