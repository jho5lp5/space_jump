<div class="modal-dialog modal-lg">
    <div class="modal-content">
        <div class="modal-header bg-gradient-warning text-white">
            <h5 class="modal-title"><i class="fas fa-edit mr-2"></i>Editar Horario</h5>
            <button type="button" class="close text-white" data-dismiss="modal">&times;</button>
        </div>
        <form id="form-schedule-update">
            <input type="hidden" name="schedule_id" value="{{ schedule_obj.id }}">
            <div class="modal-body">
                <div class="alert alert-secondary">
                    <i class="fas fa-sync-alt mr-2"></i>
                    Ciclo: <strong>{{ schedule_obj.cycle.name }}</strong>
                </div>
                
                <div class="row">
                    <div class="col-md-8">
                        <div class="form-group">
                            <label><i class="fas fa-tag mr-1"></i>Nombre *</label>
                            <input type="text" class="form-control" name="name" required 
                                   value="{{ schedule_obj.name }}">
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="form-group">
                            <label><i class="fas fa-dollar-sign mr-1"></i>Precio *</label>
                            <input type="number" class="form-control" name="price" step="0.01" 
                                   required value="{{ schedule_obj.price }}">
                        </div>
                    </div>
                </div>
                
                <div class="form-group">
                    <label><i class="fas fa-calendar-day mr-1"></i>Días de Entrenamiento</label>
                    <div class="row">
                        <div class="col-4 col-md-2">
                            <div class="custom-control custom-checkbox">
                                <input type="checkbox" class="custom-control-input" id="monday_upd" name="monday"
                                       {% if schedule_obj.monday %}checked{% endif %}>
                                <label class="custom-control-label" for="monday_upd">Lun</label>
                            </div>
                        </div>
                        <div class="col-4 col-md-2">
                            <div class="custom-control custom-checkbox">
                                <input type="checkbox" class="custom-control-input" id="tuesday_upd" name="tuesday"
                                       {% if schedule_obj.tuesday %}checked{% endif %}>
                                <label class="custom-control-label" for="tuesday_upd">Mar</label>
                            </div>
                        </div>
                        <div class="col-4 col-md-2">
                            <div class="custom-control custom-checkbox">
                                <input type="checkbox" class="custom-control-input" id="wednesday_upd" name="wednesday"
                                       {% if schedule_obj.wednesday %}checked{% endif %}>
                                <label class="custom-control-label" for="wednesday_upd">Mié</label>
                            </div>
                        </div>
                        <div class="col-4 col-md-2">
                            <div class="custom-control custom-checkbox">
                                <input type="checkbox" class="custom-control-input" id="thursday_upd" name="thursday"
                                       {% if schedule_obj.thursday %}checked{% endif %}>
                                <label class="custom-control-label" for="thursday_upd">Jue</label>
                            </div>
                        </div>
                        <div class="col-4 col-md-2">
                            <div class="custom-control custom-checkbox">
                                <input type="checkbox" class="custom-control-input" id="friday_upd" name="friday"
                                       {% if schedule_obj.friday %}checked{% endif %}>
                                <label class="custom-control-label" for="friday_upd">Vie</label>
                            </div>
                        </div>
                        <div class="col-4 col-md-2">
                            <div class="custom-control custom-checkbox">
                                <input type="checkbox" class="custom-control-input" id="saturday_upd" name="saturday"
                                       {% if schedule_obj.saturday %}checked{% endif %}>
                                <label class="custom-control-label" for="saturday_upd">Sáb</label>
                            </div>
                        </div>
                    </div>
                </div>
                
                <div class="form-group">
                    <div class="custom-control custom-switch">
                        <input type="checkbox" class="custom-control-input" id="is_active_sch" name="is_active"
                               {% if schedule_obj.is_active %}checked{% endif %}>
                        <label class="custom-control-label" for="is_active_sch">Activo</label>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-dismiss="modal">Cancelar</button>
                <button type="submit" class="btn btn-warning">
                    <i class="fas fa-save mr-1"></i>Actualizar
                </button>
            </div>
        </form>
    </div>
</div>

<script>
$('#form-schedule-update').on('submit', function(e) {
    e.preventDefault();
    var formData = $(this).serialize();
    formData += '&is_active=' + ($('#is_active_sch').is(':checked') ? 'true' : 'false');
    
    $.ajax({
        url: '{% url "apps.students:update_schedule" %}',
        type: 'POST',
        data: formData,
        success: function(response) {
            if (response.success) {
                toastr.success(response.message);
                $('#modal_schedule_update').modal('hide');
                location.reload();
            } else {
                toastr.error(response.message);
            }
        },
        error: function() {
            toastr.error('Error al actualizar');
        }
    });
});
</script>
