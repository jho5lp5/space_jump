<div class="modal-dialog">
    <div class="modal-content">
        <div class="modal-header bg-gradient-warning text-white">
            <h5 class="modal-title" style="font-size: 0.95rem;"><i class="fas fa-edit mr-2"></i>Editar Turno</h5>
            <button type="button" class="close text-white" data-dismiss="modal">&times;</button>
        </div>
        <form id="form-timeslot-update">
            <input type="hidden" name="timeslot_id" value="{{ timeslot_obj.id }}">
            <div class="modal-body" style="font-size: 0.875rem;">
                <div class="alert alert-secondary py-2 mb-3">
                    <small style="font-size: 0.8rem;">
                        <i class="fas fa-sync-alt mr-1"></i>{{ timeslot_obj.schedule.cycle.name }} /
                        <i class="fas fa-calendar-week mr-1"></i>{{ timeslot_obj.schedule.name }}
                    </small>
                </div>
                
                <div class="row">
                    <div class="col-6">
                        <div class="form-group mb-3">
                            <label class="mb-1" style="font-size: 0.85rem;"><i class="fas fa-play mr-1"></i>Hora Inicio *</label>
                            <input type="time" class="form-control rounded-pill" name="start_time" required
                                   value="{{ timeslot_obj.start_time|time:'H:i' }}" style="font-size: 0.875rem;">
                        </div>
                    </div>
                    <div class="col-6">
                        <div class="form-group mb-3">
                            <label class="mb-1" style="font-size: 0.85rem;"><i class="fas fa-stop mr-1"></i>Hora Fin *</label>
                            <input type="time" class="form-control rounded-pill" name="end_time" required
                                   value="{{ timeslot_obj.end_time|time:'H:i' }}" style="font-size: 0.875rem;">
                        </div>
                    </div>
                </div>
                
                <div class="form-group mb-3">
                    <label class="mb-1" style="font-size: 0.85rem;"><i class="fas fa-users mr-1"></i>Descripción de Edad</label>
                    <input type="text" class="form-control rounded-pill" name="age_description" 
                           value="{{ timeslot_obj.age_description }}" style="font-size: 0.875rem;">
                </div>
                
                <div class="row">
                    <div class="col-6">
                        <div class="form-group mb-3">
                            <label class="mb-1" style="font-size: 0.85rem;"><i class="fas fa-user-friends mr-1"></i>Capacidad</label>
                            <input type="number" class="form-control rounded-pill" name="capacity" 
                                   value="{{ timeslot_obj.capacity }}" min="1" style="font-size: 0.875rem;">
                        </div>
                    </div>
                    <div class="col-6">
                        <div class="form-group mb-3">
                            <label class="mb-1" style="font-size: 0.85rem;"><i class="fas fa-chalkboard-teacher mr-1"></i>Profesor</label>
                            <select class="form-control rounded-pill" name="teacher_id" style="font-size: 0.875rem;">
                                <option value="">Seleccionar profesor...</option>
                                {% for teacher in teachers %}
                                    <option value="{{ teacher.id }}" {% if timeslot_obj.teacher and timeslot_obj.teacher.id == teacher.id %}selected{% endif %}>
                                        {{ teacher.get_full_name|default:teacher.username }}
                                    </option>
                                {% endfor %}
                            </select>
                        </div>
                    </div>
                </div>
                
                <div class="form-group mb-3">
                    <div class="custom-control custom-switch">
                        <input type="checkbox" class="custom-control-input" id="is_active_ts" name="is_active"
                               {% if timeslot_obj.is_active %}checked{% endif %}>
                        <label class="custom-control-label" for="is_active_ts" style="font-size: 0.875rem;">Activo</label>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary rounded-pill" data-dismiss="modal" style="font-size: 0.875rem;">Cancelar</button>
                <button type="submit" class="btn btn-warning rounded-pill" style="font-size: 0.875rem;">
                    <i class="fas fa-save mr-1"></i>Actualizar
                </button>
            </div>
        </form>
    </div>
</div>

<script>
$('#form-timeslot-update').on('submit', function(e) {
    e.preventDefault();
    var formData = $(this).serialize();
    formData += '&is_active=' + ($('#is_active_ts').is(':checked') ? 'true' : 'false');
    
    $.ajax({
        url: '{% url "apps.students:update_timeslot" %}',
        type: 'POST',
        data: formData,
        success: function(response) {
            if (response.success) {
                toastr.success(response.message);
                $('#modal_timeslot_update').modal('hide');
                location.reload();
            } else {
                toastr.error(response.message);
            }
        },
        error: function() {
            toastr.error('Error al actualizar');
        }
    });
});
</script>
