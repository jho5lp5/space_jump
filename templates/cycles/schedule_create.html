<div class="modal-dialog modal-lg">
    <div class="modal-content">
        <div class="modal-header bg-gradient-info text-white">
            <h5 class="modal-title"><i class="fas fa-calendar-week mr-2"></i>Nuevo Horario de Entrenamiento</h5>
            <button type="button" class="close text-white" data-dismiss="modal">&times;</button>
        </div>
        <form id="form-schedule-create">
            <input type="hidden" name="cycle_id" value="{{ cycle_obj.id }}">
            <div class="modal-body">
                <div class="alert alert-info">
                    <i class="fas fa-info-circle mr-2"></i>
                    Creando horario para: <strong>{{ cycle_obj.name }}</strong>
                </div>
                
                <div class="row">
                    <div class="col-md-8">
                        <div class="form-group">
                            <label><i class="fas fa-tag mr-1"></i>Nombre del Horario *</label>
                            <input type="text" class="form-control" name="name" required
                                   autocomplete="off" aria-label=""
                                   placeholder="Ej: Interdiario, Diario, Fin de Semana">
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="form-group">
                            <label><i class="fas fa-dollar-sign mr-1"></i>Precio *</label>
                            <input type="number" class="form-control" name="price" step="0.01"
                                   autocomplete="off" aria-label=""
                                   required placeholder="0.00">
                        </div>
                    </div>
                </div>
                
                <div class="form-group">
                    <label><i class="fas fa-calendar-day mr-1"></i>Días de Entrenamiento *</label>
                    <div class="row">
                        <div class="col-4 col-md-2">
                            <div class="custom-control custom-checkbox">
                                <input type="checkbox" class="custom-control-input" id="monday" name="monday">
                                <label class="custom-control-label" for="monday">Lun</label>
                            </div>
                        </div>
                        <div class="col-4 col-md-2">
                            <div class="custom-control custom-checkbox">
                                <input type="checkbox" class="custom-control-input" id="tuesday" name="tuesday">
                                <label class="custom-control-label" for="tuesday">Mar</label>
                            </div>
                        </div>
                        <div class="col-4 col-md-2">
                            <div class="custom-control custom-checkbox">
                                <input type="checkbox" class="custom-control-input" id="wednesday" name="wednesday">
                                <label class="custom-control-label" for="wednesday">Mié</label>
                            </div>
                        </div>
                        <div class="col-4 col-md-2">
                            <div class="custom-control custom-checkbox">
                                <input type="checkbox" class="custom-control-input" id="thursday" name="thursday">
                                <label class="custom-control-label" for="thursday">Jue</label>
                            </div>
                        </div>
                        <div class="col-4 col-md-2">
                            <div class="custom-control custom-checkbox">
                                <input type="checkbox" class="custom-control-input" id="friday" name="friday">
                                <label class="custom-control-label" for="friday">Vie</label>
                            </div>
                        </div>
                        <div class="col-4 col-md-2">
                            <div class="custom-control custom-checkbox">
                                <input type="checkbox" class="custom-control-input" id="saturday" name="saturday">
                                <label class="custom-control-label" for="saturday">Sáb</label>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-dismiss="modal">Cancelar</button>
                <button type="submit" class="btn btn-info">
                    <i class="fas fa-save mr-1"></i>Guardar Horario
                </button>
            </div>
        </form>
    </div>
</div>

<script>
$('#form-schedule-create').on('submit', function(e) {
    e.preventDefault();
    $.ajax({
        url: '{% url "apps.students:save_schedule" %}',
        type: 'POST',
        data: $(this).serialize(),
        success: function(response) {
            if (response.success) {
                toastr.success(response.message);
                $('#modal_schedule_create').modal('hide');
                location.reload();
            } else {
                toastr.error(response.message);
            }
        },
        error: function() {
            toastr.error('Error al guardar');
        }
    });
});
</script>
