<div class="modal-dialog">
    <div class="modal-content">
        <div class="modal-header bg-gradient-success text-white">
            <h5 class="modal-title" style="font-size: 0.95rem;"><i class="fas fa-clock mr-2"></i>Nuevo Turno</h5>
            <button type="button" class="close text-white" data-dismiss="modal">&times;</button>
        </div>
        <form id="form-timeslot-create">
            <input type="hidden" name="schedule_id" value="{{ schedule_obj.id }}">
            <div class="modal-body" style="font-size: 0.875rem;">
                <div class="alert alert-info py-2 mb-3">
                    <small style="font-size: 0.8rem;">
                        <i class="fas fa-sync-alt mr-1"></i>{{ schedule_obj.cycle.name }} /
                        <i class="fas fa-calendar-week mr-1"></i>{{ schedule_obj.name }}
                    </small>
                </div>
                
                <div class="row">
                    <div class="col-6">
                        <div class="form-group mb-3">
                            <label class="mb-1" style="font-size: 0.85rem;"><i class="fas fa-play mr-1"></i>Hora Inicio *</label>
                            <input type="time" class="form-control rounded-pill" name="start_time" required style="font-size: 0.875rem;">
                        </div>
                    </div>
                    <div class="col-6">
                        <div class="form-group mb-3">
                            <label class="mb-1" style="font-size: 0.85rem;"><i class="fas fa-stop mr-1"></i>Hora Fin *</label>
                            <input type="time" class="form-control rounded-pill" name="end_time" required style="font-size: 0.875rem;">
                        </div>
                    </div>
                </div>
                
                <div class="form-group mb-3">
                    <label class="mb-1" style="font-size: 0.85rem;"><i class="fas fa-users mr-1"></i>Descripción de Edad</label>
                    <input type="text" class="form-control rounded-pill" name="age_description"
                           autocomplete="off" aria-label=""
                           placeholder="Ej: Alumnos de 13 a 17 años" style="font-size: 0.875rem;">
                </div>
                
                <div class="row">
                    <div class="col-6">
                        <div class="form-group mb-3">
                            <label class="mb-1" style="font-size: 0.85rem;"><i class="fas fa-user-friends mr-1"></i>Capacidad</label>
                            <input type="number" autocomplete="off" aria-label=""
                                   class="form-control rounded-pill" name="capacity" value="20" min="1" style="font-size: 0.875rem;">
                        </div>
                    </div>
                    <div class="col-6">
                        <div class="form-group mb-3">
                            <label class="mb-1" style="font-size: 0.85rem;"><i class="fas fa-chalkboard-teacher mr-1"></i>Profesor</label>
                            <select class="form-control rounded-pill" name="teacher_id" style="font-size: 0.875rem;">
                                <option value="">Seleccionar profesor...</option>
                                {% for teacher in teachers %}
                                    <option value="{{ teacher.id }}">{{ teacher.get_full_name|default:teacher.username }}</option>
                                {% endfor %}
                            </select>
                        </div>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary rounded-pill" data-dismiss="modal" style="font-size: 0.875rem;">Cancelar</button>
                <button type="submit" class="btn btn-success rounded-pill" style="font-size: 0.875rem;">
                    <i class="fas fa-save mr-1"></i>Guardar Turno
                </button>
            </div>
        </form>
    </div>
</div>

<script>
$('#form-timeslot-create').on('submit', function(e) {
    e.preventDefault();
    $.ajax({
        url: '{% url "apps.students:save_timeslot" %}',
        type: 'POST',
        data: $(this).serialize(),
        success: function(response) {
            if (response.success) {
                toastr.success(response.message);
                $('#modal_timeslot_create').modal('hide');
                location.reload();
            } else {
                toastr.error(response.message);
            }
        },
        error: function() {
            toastr.error('Error al guardar');
        }
    });
});
</script>
