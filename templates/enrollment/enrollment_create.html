<div class="modal-dialog modal-lg">
    <div class="modal-content">
        <div class="modal-header bg-gradient-primary text-white">
            <h5 class="modal-title" style="font-size: 0.95rem;"><i class="fas fa-user-plus mr-2"></i>Nueva Inscripción</h5>
            <button type="button" class="close text-white" data-dismiss="modal">&times;</button>
        </div>
        <form id="form-enrollment-create">
            <div class="modal-body" style="font-size: 0.875rem;">
                <!-- Búsqueda de deportista -->
                <div class="form-group" style="position: relative;">
                    <label><i class="fas fa-user-graduate mr-1"></i>Deportista *</label>
                    <input type="text" class="form-control rounded-pill" id="student_search" 
                           placeholder="Buscar por nombre o DNI..." autocomplete="off" style="font-size: 0.875rem;">
                    <input type="hidden" name="student_id" id="student_id" required>
                    <div id="student_results" class="list-group shadow-sm" style="display: none; position: absolute; z-index: 1000; width: calc(100% - 30px); max-height: 250px; overflow-y: auto; border: 1px solid #dee2e6; border-radius: 0.5rem; background: white; margin-top: 2px; box-shadow: 0 0.125rem 0.25rem rgba(0,0,0,0.075);"></div>
                </div>
                
                <div class="row">
                    <div class="col-md-6">
                        <div class="form-group">
                            <label><i class="fas fa-sync-alt mr-1"></i>Ciclo *</label>
                            <select class="form-control rounded-pill" name="cycle_id" id="cycle_select" required style="font-size: 0.875rem;">
                                <option value="">Seleccionar ciclo...</option>
                                {% for cycle in cycles %}
                                <option value="{{ cycle.id }}">{{ cycle.name }}</option>
                                {% endfor %}
                            </select>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="form-group">
                            <label><i class="fas fa-calendar-week mr-1"></i>Horario *</label>
                            <select class="form-control rounded-pill" name="schedule_id" id="schedule_select" required disabled style="font-size: 0.875rem;">
                                <option value="">Primero seleccione un ciclo</option>
                            </select>
                        </div>
                    </div>
                </div>
                
                <div class="row">
                    <div class="col-md-6">
                        <div class="form-group">
                            <label><i class="fas fa-clock mr-1"></i>Turno *</label>
                            <select class="form-control rounded-pill" name="timeslot_id" id="timeslot_select" required disabled style="font-size: 0.875rem;">
                                <option value="">Primero seleccione un horario</option>
                            </select>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="form-group">
                            <label><i class="fas fa-calendar mr-1"></i>Fecha de Inscripción *</label>
                            <input type="date" class="form-control rounded-pill" name="enrollment_date" 
                                   value="{% now 'Y-m-d' %}" required style="font-size: 0.875rem;">
                        </div>
                    </div>
                </div>
                
                <div class="row">
                    <div class="col-md-3">
                        <div class="form-group">
                            <label><i class="fas fa-dollar-sign mr-1"></i>Precio Total *</label>
                            <input type="number" class="form-control rounded-pill" name="price" id="price_input"
                                   autocomplete="off" step="0.01" required readonly
                                   style="background-color: #f8f9fa; font-weight: bold; font-size: 0.875rem;">
                            <small class="text-muted">Precio del horario seleccionado</small>
                        </div>
                    </div>
                    <div class="col-md-3">
                        <div class="form-group">
                            <label><i class="fas fa-money-bill-wave mr-1"></i>Adelanto / Pago *</label>
                            <input type="number" class="form-control rounded-pill" name="advance" id="advance_input"
                                   autocomplete="off" step="0.01" value="0.00" required style="font-size: 0.875rem;">
                            <small class="text-muted">Monto pagado inicialmente</small>
                        </div>
                    </div>
                    <div class="col-md-3">
                        <div class="form-group">
                            <label><i class="fas fa-exclamation-circle mr-1"></i>Faltante</label>
                            <input type="number" class="form-control rounded-pill" id="remaining_input"
                                   autocomplete="off" step="0.01" readonly
                                   style="background-color: #FFFBEB; font-weight: bold; font-size: 0.875rem;">
                            <small class="text-muted">Se calcula automáticamente</small>
                        </div>
                    </div>
                    <div class="col-md-3">
                        <div class="form-group">
                            <label><i class="fas fa-credit-card mr-1"></i>Método de Pago</label>
                            <select class="form-control rounded-pill" name="payment_method" style="font-size: 0.875rem;">
                                <option value="E">Efectivo</option>
                                <option value="Y">Yape</option>
                                <option value="D">Depósito/Transferencia</option>
                                <option value="C">Crédito</option>
                            </select>
                        </div>
                    </div>
                </div>
                
                <div class="row">
                    <div class="col-md-6">
                        <div class="form-group">
                            <label><i class="fas fa-building mr-1"></i>Sede</label>
                            <select class="form-control rounded-pill" name="subsidiary_id" style="font-size: 0.875rem;">
                                <option value="">Seleccionar...</option>
                                {% for sub in subsidiaries %}
                                <option value="{{ sub.id }}">{{ sub.name }}</option>
                                {% endfor %}
                            </select>
                        </div>
                    </div>
                </div>
                
                <div class="form-group">
                    <label><i class="fas fa-sticky-note mr-1"></i>Observaciones</label>
                    <textarea class="form-control rounded" name="observations" rows="2" style="font-size: 0.875rem;"></textarea>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary rounded-pill" data-dismiss="modal" style="font-size: 0.875rem;">Cancelar</button>
                <button type="submit" class="btn btn-primary rounded-pill" style="font-size: 0.875rem;">
                    <i class="fas fa-save mr-1"></i>Guardar Inscripción
                </button>
            </div>
        </form>
    </div>
</div>

<script>
$(document).ready(function() {
    var searchTimeout;
    
    // Autocomplete simple para búsqueda de estudiantes
    $('#student_search').on('input', function() {
        var query = $(this).val();
        var resultsDiv = $('#student_results');
        var studentIdInput = $('#student_id');
        
        clearTimeout(searchTimeout);
        
        if (query.length < 2) {
            resultsDiv.hide().empty();
            studentIdInput.val('');
            return;
        }
        
        searchTimeout = setTimeout(function() {
            $.get('{% url "apps.students:search_students" %}', {q: query}, function(data) {
                resultsDiv.empty();
                
                if (data.results && data.results.length > 0) {
                    data.results.forEach(function(student) {
                        var item = $('<a href="#" class="list-group-item list-group-item-action" style="cursor: pointer;">')
                            .html('<strong>' + student.full_name + '</strong><br><small class="text-muted">DNI: ' + student.document_number + '</small>')
                            .on('mouseenter', function() {
                                $(this).addClass('active');
                            })
                            .on('mouseleave', function() {
                                $(this).removeClass('active');
                            })
                            .on('click', function(e) {
                                e.preventDefault();
                                $('#student_search').val(student.full_name + ' - ' + student.document_number);
                                studentIdInput.val(student.id);
                                resultsDiv.hide();
                            });
                        resultsDiv.append(item);
                    });
                    resultsDiv.show();
                } else {
                    resultsDiv.html('<div class="list-group-item text-muted">No se encontraron resultados</div>').show();
                }
            });
        }, 300);
    });
    
    // Ocultar resultados al hacer clic fuera
    $(document).on('click', function(e) {
        if (!$(e.target).closest('#student_search, #student_results').length) {
            $('#student_results').hide();
        }
    });
    
    // Cargar horarios al seleccionar ciclo
    $('#cycle_select').on('change', function() {
        var cycleId = $(this).val();
        var scheduleSelect = $('#schedule_select');
        var timeslotSelect = $('#timeslot_select');
        
        scheduleSelect.html('<option value="">Cargando...</option>').prop('disabled', true);
        timeslotSelect.html('<option value="">Primero seleccione un horario</option>').prop('disabled', true);
        $('#price_input').val('0.00');
        $('#advance_input').val('0.00');
        $('#remaining_input').val('0.00');
        
        if (cycleId) {
            $.get('{% url "apps.students:get_schedules_by_cycle" %}', {cycle_id: cycleId}, function(data) {
                var options = '<option value="">Seleccionar horario...</option>';
                data.schedules.forEach(function(s) {
                    options += '<option value="' + s.id + '" data-price="' + s.price + '">' + s.name + ' - S/' + s.price + '</option>';
                });
                scheduleSelect.html(options).prop('disabled', false);
            });
        }
    });
    
    // Cargar turnos y precio al seleccionar horario
    $('#schedule_select').on('change', function() {
        var scheduleId = $(this).val();
        var timeslotSelect = $('#timeslot_select');
        var price = parseFloat($(this).find(':selected').data('price')) || 0;
        
        // Establecer precio automáticamente
        $('#price_input').val(price.toFixed(2));
        calculateRemaining();
        
        timeslotSelect.html('<option value="">Cargando...</option>').prop('disabled', true);
        
        if (scheduleId) {
            $.get('{% url "apps.students:get_timeslots_by_schedule" %}', {schedule_id: scheduleId}, function(data) {
                var options = '<option value="">Seleccionar turno...</option>';
                data.timeslots.forEach(function(t) {
                    options += '<option value="' + t.id + '">' + t.display + '</option>';
                });
                timeslotSelect.html(options).prop('disabled', false);
            });
        }
    });
    
    // Calcular faltante cuando cambia el adelanto
    $('#advance_input').on('input', function() {
        calculateRemaining();
    });
    
    function calculateRemaining() {
        var price = parseFloat($('#price_input').val()) || 0;
        var advance = parseFloat($('#advance_input').val()) || 0;
        var remaining = Math.max(0, price - advance);
        $('#remaining_input').val(remaining.toFixed(2));
    }
});

$('#form-enrollment-create').on('submit', function(e) {
    e.preventDefault();
    
    // Validar que se haya seleccionado un estudiante
    if (!$('#student_id').val()) {
        toastr.error('Por favor seleccione un deportista');
        return;
    }
    
    // Calcular faltante antes de enviar
    var price = parseFloat($('#price_input').val()) || 0;
    var advance = parseFloat($('#advance_input').val()) || 0;
    var remaining = Math.max(0, price - advance);
    
    // Agregar faltante al formulario
    if (!$('input[name="remaining"]').length) {
        $('<input>').attr({
            type: 'hidden',
            name: 'remaining',
            value: remaining.toFixed(2)
        }).appendTo(this);
    } else {
        $('input[name="remaining"]').val(remaining.toFixed(2));
    }
    
    $.ajax({
        url: '{% url "apps.students:save_enrollment" %}',
        type: 'POST',
        data: $(this).serialize(),
        success: function(response) {
            if (response.success) {
                toastr.success(response.message);
                $('#modal_enrollment_create').modal('hide');
                
                // Descargar PDF automáticamente si se generó
                if (response.pdf_generated && response.pdf_url) {
                    // Crear un enlace temporal para descargar el PDF
                    var link = document.createElement('a');
                    link.href = response.pdf_url;
                    link.download = 'RECIBO_INSCRIPCION_' + response.enrollment_id + '.pdf';
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);
                    
                    // Esperar un momento antes de recargar para que la descarga inicie
                    setTimeout(function() {
                        location.reload();
                    }, 500);
                } else {
                    location.reload();
                }
            } else {
                toastr.error(response.message);
            }
        },
        error: function() {
            toastr.error('Error al guardar la inscripción');
        }
    });
});
</script>
